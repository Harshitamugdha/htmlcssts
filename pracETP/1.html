<!-- Create  a system which is responsible for calculating salary of an employee with the help of variable functions and class -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Employee Salary Calculator</h2>
    <label for="salary">Enter Salary:</label>
    <input type="number" id="salary">
    <button onclick="calculateSalary()">Calculate</button>

    <h3 id="result"></h3>

    <script>

        function calculateSalary(){
            let salary=Number(document.getElementById("salary").value); //Number() is used to convert the input value from string to number
            let bonus;
            let finalSalary;

            if(salary>=50000){
                bonus=salary*0.20;
            }
            else{
                bonus=salary*0.10;
            }
            finalSalary=salary+bonus;
            document.getElementById("result").innerText=`Final Salary: ${finalSalary}`;
        }
    </script>
</body>
</html>
